version: "3.8"

services:
  mimir:
    build: .
    container_name: mimir-rag
    volumes:
      # Map the data directories and SQLite database to persist state across container restarts
      - ./docs:/app/docs
      - ./scratch:/app/scratch
      - ./temp:/app/temp
      - ./mimir_portal.db:/app/mimir_portal.db
      - ./gcp-key.json:/app/gcp-key.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-key.json
    env_file:
      - .env
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mimir

volumes:
  caddy_data:
  caddy_config:
