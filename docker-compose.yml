version: '3.8'

services:
  mimir:
    build: .
    container_name: mimir-rag
    volumes:
      # Map the data directories to persist state across container restarts
      - ./docs:/app/docs
      - ./scratch:/app/scratch
      - ./local_qdrant_db:/app/local_qdrant_db
      - ./temp:/app/temp
    env_file:
      - .env
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mimir

volumes:
  caddy_data:
  caddy_config:
