version: "3.8"

services:
  mimir:
    build: .
    container_name: mimir-rag
    volumes:
      # Map the data directories to persist state across container restarts
      - ./docs:/app/docs
      - ./scratch:/app/scratch
      - ./local_qdrant_db:/app/local_qdrant_db
      - ./temp:/app/temp
      - ./gcp-key.json:/app/gcp-key.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-key.json
    env_file:
      - .env
    restart: unless-stopped

  weaviate:
    image: semitechnologies/weaviate:1.27.0
    container_name: weaviate-rag
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - ./weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
    restart: unless-stopped
  caddy:
    image: caddy:2
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mimir

volumes:
  caddy_data:
  caddy_config:
