<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#353d50" opacity="0.4"/>
    </pattern>

    <linearGradient id="gold" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Layered radial glow. Gradients rasterize far more reliably on export
         than blur filters, which is what mattered for the slide deck. -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="45%"  stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="75%"  stop-color="#f59e0b" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fbbf24" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%"  stop-color="#0d1119" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="0.85"/>
    </radialGradient>

    <style>
      .float { animation: float 6s ease-in-out infinite; transform-origin: 500px 500px; }
      .pulse { animation: pulse 5s ease-in-out infinite; transform-origin: 500px 500px; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      @keyframes pulse { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .float, .pulse { animation: none; } }
    </style>
  </defs>

  <rect width="1000" height="1000" fill="#0d1119"/>
  <rect width="1000" height="1000" fill="url(#grid)"/>

  <g class="pulse">
    <circle cx="500" cy="500" r="380" fill="url(#halo)"/>
    <circle cx="500" cy="500" r="210" fill="url(#core)"/>
  </g>

  <svg class="float" x="330" y="330" width="340" height="340" viewBox="0 0 24 24">
    <path d="M2.5 16.88a1 1 0 0 1-.32-1.43l9-13.02a1 1 0 0 1 1.64 0l9 13.01a1 1 0 0 1-.32 1.44l-8.51 4.86a2 2 0 0 1-1.98 0Z"
          fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 2 L12 22"
          fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <rect width="1000" height="1000" fill="url(#vignette)"/>
</svg>
